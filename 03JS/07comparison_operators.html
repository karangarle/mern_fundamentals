<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Comparison Operators</title>
    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>

  <body>
    <script>
      document.write("<h2>JavaScript Comparison Operators</h2>");
      document.write(
        "Comparison operators do values ko compare karte hain aur result true ya false dete hain.<br><br>",
      );

      let x = 10;
      let y = 20;
      let z = "10";

      document.write(`x = ${x}, y = ${y}, z = "${z}" <br><br>`);

      document.write(`x == z : ${x == z} <br>`); // value same hai
      document.write(`x === z : ${x === z} <br>`); // value same hai but type different hai
      document.write(`x != y : ${x != y} <br>`);
      document.write(`x !== z : ${x !== z} <br>`);
      document.write(`x > y : ${x > y} <br>`);
      document.write(`x < y : ${x < y} <br>`);
      document.write(`x >= 10 : ${x >= 10} <br>`);
      document.write(`y <= 20 : ${y <= 20} <br>`);
    </script>
  </body>
</html>
