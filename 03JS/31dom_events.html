<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript DOM Events</title>
  </head>

  <body>
    <h1>JavaScript DOM Events</h1>
    <p>
      Event ka matlab user action hota hai, jaise click, input, mouseover,
      keyup.
    </p>

    <input type="text" id="userName" placeholder="Type your name" />
    <button id="showBtn">Show Name</button>
    <p id="output"></p>

    <script>
      // addEventListener JavaScript se event handle karne ka modern way hai.
      let userName = document.getElementById("userName");
      let showBtn = document.getElementById("showBtn");
      let output = document.getElementById("output");

      showBtn.addEventListener("click", function () {
        output.innerText = `Hello ${userName.value}`;
      });

      userName.addEventListener("keyup", function () {
        output.innerText = `Typing : ${userName.value}`;
      });
    </script>
  </body>
</html>
