<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JavaScript Switch Statement</title>
  </head>
  <body>
    <h1>JavaScript Switch Statement</h1>

    <script>
      document.write('Switch statement ek value ko multiple cases ke sath compare karta hai.<br><br>');

      let x = "apple";
      switch (x) 
      {
        case "cake":
        document.write("x is cake");
        break;
        case "orange":
        document.write("x is orange");
        break;
        case "apple":
        document.write("x is apple");
        break;
        default:
        document.write("default case running");
      }
    </script>
  </body>
</html>
