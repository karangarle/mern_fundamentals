<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript DOM Manipulation</title>

    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>
  <body>
    <h1>DOM Manipulation!</h1>
    <p>
      DOM ka use HTML elements ko JavaScript se select, change, hide, show ya
      style karne ke liye hota hai.
    </p>

    <div id="myBox">I am a box!</div>

    <div class="button-row">
      <button onclick="changeText()">Change Text</button>
      <button onclick="changeColor()">Change Color</button>
      <button onclick="hideBox()">Hide Box</button>
      <button onclick="showBox()">Show Box</button>
      <button onclick="changeElement()">Change Element</button>
    </div>

    <script>
      // getElementById selects an HTML element using its id.
      function changeText() {
        document.getElementById("myBox").innerText = "Text Changed";
      }

      function changeColor() {
        document.getElementById("myBox").style.backgroundColor = "red";
      }

      function hideBox() {
        document.getElementById("myBox").style.display = "none";
      }

      function showBox() {
        document.getElementById("myBox").style.display = "flex";
      }

      function changeElement() {
        document.getElementById("myBox").innerHTML = "<i>element Change</i>";
      }
    </script>
  </body>
</html>
