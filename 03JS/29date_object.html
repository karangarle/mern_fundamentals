<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Date Object</title>
    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>

  <body>
    <script>
      document.write("<h2>JavaScript Date Object</h2>");
      document.write(
        "Date object current date, time, year, month aur day nikalne ke liye use hota hai.<br><br>",
      );

      let today = new Date();

      document.write(`Full Date : ${today} <br>`);
      document.write(`Year : ${today.getFullYear()} <br>`);
      document.write(`Month Number : ${today.getMonth()} <br>`);
      document.write(`Date : ${today.getDate()} <br>`);
      document.write(`Day Number : ${today.getDay()} <br>`);
      document.write(`Hours : ${today.getHours()} <br>`);
      document.write(`Minutes : ${today.getMinutes()} <br>`);
      document.write(`Seconds : ${today.getSeconds()} <br>`);
    </script>
  </body>
</html>
