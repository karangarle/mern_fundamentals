<!doctype html>
<html>
  <head>
    <title>JavaScript Do While Loop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>
  <body>
    <script>
      document.write("<h2>JavaScript Do While Loop</h2>");
      document.write(
        "Do while loop pehle code run karta hai, phir condition check karta hai. Isliye ye kam se kam ek baar zaroor run hota hai.<br><br>",
      );

      let x = 1;
      do {
        document.write("It will run only once");
      } while (x >= 10);
    </script>
  </body>
</html>
