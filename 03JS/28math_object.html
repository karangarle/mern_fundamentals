<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Math Object</title>
  </head>

  <body>
    <script>
      document.write("<h2>JavaScript Math Object</h2>");
      document.write(
        "Math object numbers ke sath common mathematical operations karne ke liye use hota hai.<br><br>",
      );

      let num = 25.67;

      document.write(`Number : ${num} <br>`);
      document.write(`Round : ${Math.round(num)} <br>`);
      document.write(`Floor : ${Math.floor(num)} <br>`);
      document.write(`Ceil : ${Math.ceil(num)} <br>`);
      document.write(`Power : ${Math.pow(2, 3)} <br>`);
      document.write(`Square Root : ${Math.sqrt(25)} <br>`);
      document.write(`Minimum : ${Math.min(10, 20, 5, 30)} <br>`);
      document.write(`Maximum : ${Math.max(10, 20, 5, 30)} <br>`);
      document.write(`Random Number : ${Math.random()} <br>`);
      document.write(
        `Random 1 to 10 : ${Math.floor(Math.random() * 10) + 1} <br>`,
      );
    </script>
  </body>
</html>
