<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JS Arithmetic Operators</title>
    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>
  <body>
    <script>
      document.write("<h2>JavaScript Arithmetic Operators</h2>");
      document.write(
        "Arithmetic operators ka use maths calculation ke liye hota hai, jaise +, -, *, /, %, **.<br><br>",
      );

      let x = 9;
      let y = 2;
      document.write("Value of x : " + x);
      document.write("<br>Value of y : " + y);
      document.write("<br>Sum Of x and y : " + (x + y));
      document.write("<br> Product of Of x and y : " + x * y);
      document.write("<br> Division of Of x and y : " + x / y);
      document.write("<br> Subtraction Of x and y : " + (x - y));
      document.write("<br> Modulus Of x and y : " + (x % y));
      document.write("<br> Power of x and y : " + x ** y);
    </script>
  </body>
</html>
