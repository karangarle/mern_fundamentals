<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES6 Destructuring</title>
    <link rel="stylesheet" href="style.css" />
    <script src="navigation.js" defer></script>
  </head>

  <body>
    <h1>ES6 Destructuring</h1>
    <p>
      Destructuring se array ya object ke values ko direct variables me store
      kar sakte hain.
    </p>
    <button onclick="showData()">Show Data</button><br /><br />
    <p id="output"></p>

    <script>
      // In React - destructuring props
      function StudentCard({ name, age, city }) {
        return `${name} is ${age} years old from ${city}`;
      }

      function showData() {
        // Object destructuring
        let student = {
          name: "Raj",
          age: 22,
          city: "Ahmedabad",
          course: "MERN Stack",
        };

        let { name, age, city, course } = student;

        // Array destructuring
        let topStudents = ["Raj", "Priya", "Amit"];
        let [first, second, third] = topStudents;

        document.getElementById("output").innerHTML = `
          <h2>Student Details:</h2>
          <p>Name: ${name}</p>
          <p>Age: ${age}</p>
          <p>City: ${city}</p>
          <p>Course: ${course}</p>

          <h2>Top Students:</h2>
          <p>1st: ${first}</p>
          <p>2nd: ${second}</p>
          <p>3rd: ${third}</p>
        `;
      }
    </script>
  </body>
</html>
