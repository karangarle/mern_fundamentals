<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Js Conditional / Ternary Operators</title>
  </head>
  <body>
    <script>
      document.write("<h2>JavaScript Ternary Operator</h2>");
      document.write(
        "Ternary operator if else ka short form hai: condition ? true value : false value.<br><br>",
      );

      let x = 5;
      let y = 7;
      let result = x > y ? "x is greater then y" : "x is lower then y";
      document.write(result);
    </script>
  </body>
</html>
