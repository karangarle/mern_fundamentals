<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Js Increment / Decrement Operators</title>
  </head>
  <body>
    <script>
      document.write("<h2>JavaScript Increment / Decrement Operators</h2>");
      document.write(
        "Increment value ko 1 se badhata hai aur decrement value ko 1 se ghatata hai.<br><br>",
      );

      let x = 1;
      ++x;
      document.write("Value of x : " + x);
      x++;
      document.write("<br>Value of x : " + x);
      x--;
      document.write("<br>Value of x : " + x);
      --x;
      document.write("<br>Value of x : " + x);
    </script>
  </body>
</html>
