<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript For Loop</title>
  </head>

  <body>
    <h1>JavaScript For Loop</h1>
    <p>
      For loop tab use hota hai jab hume pata ho code kitni baar repeat karna
      hai.
    </p>

    <script>
      let number = 5;
      for (let x = 1; x <= 10; x++) {
        document.write(number + " x " + x + " = " + x * number + "<br>");
      }

      let array_var = [12, 234, 45];
      for (let index = 0; index < array_var.length; index++) {
        document.write(
          "Array Key : " + index + " , Value : " + array_var[index] + "<br>",
        );
      }

      for (let x = 1; x <= 5; x++) {
        for (let y = 1; y <= x; y++) {
          document.write(y + " ");
        }
        /*for line break*/
        document.write("<br>");
      }
    </script>
  </body>
</html>
