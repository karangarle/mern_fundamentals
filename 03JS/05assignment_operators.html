<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JS Assignment Operators</title>
  </head>
  <body>
    <script>
      document.write('<h2>JavaScript Assignment Operators</h2>');
      document.write('Assignment operators variable ki value ko update karne ke liye use hote hain, jaise +=, -=, *=, /=.<br><br>');

      let x = 9;
      x += 90;  
      document.write('Now Value Of x : '+x);
      x -= 90;
      document.write('<br>Now Value Of x : '+x);
      x *= 2;
      document.write('<br>Now Value Of x : '+x);
      x %= 4;
      document.write('<br>Now Value Of x : '+x);
      x /= 9;
      document.write('<br>Now Value Of x : '+x);
    </script>
  </body>
</html>
