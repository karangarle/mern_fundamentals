<!DOCTYPE html >
<html>
  <head>
    <meta charset="utf-8">
    <title>Js Increment / Decrement Operators</title>
  </head>
  <body>
    <script>
      let x = 1;
      ++x;
      document.write('Value of x : '+x);
      x++;
      document.write('<br>Value of x : '+x);
      x--;
      document.write('<br>Value of x : '+x);
      --x;
      document.write('<br>Value of x : '+x);
    </script>
  </body>
</html>
